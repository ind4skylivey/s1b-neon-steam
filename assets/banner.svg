<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">S1B NEON</title>
  <desc id="d">Cyberpunk glass-neon skin for Steam, Millennium</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0820"/>
      <stop offset="0.55" stop-color="#1a0d36"/>
      <stop offset="1" stop-color="#120926"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="0.15" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#ff2d78" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ff2d78" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.92" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.6" cy="1" r="0.5">
      <stop offset="0" stop-color="#d04dff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#d04dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neonLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d78"/>
      <stop offset="0.5" stop-color="#d04dff"/>
      <stop offset="1" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d78"/>
      <stop offset="0.55" stop-color="#d04dff"/>
      <stop offset="1" stop-color="#00d4ff"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" fill-opacity="0.035"/>
    </pattern>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#d04dff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="blur6" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur14" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="win"><rect x="96" y="48" width="1088" height="304" rx="14"/></clipPath>
  </defs>

  <!-- background -->
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#glowPink)"/>
  <rect width="1280" height="400" fill="url(#glowCyan)"/>
  <rect width="1280" height="400" fill="url(#glowPurple)"/>

  <!-- window glow -->
  <rect x="96" y="48" width="1088" height="304" rx="14" fill="none" stroke="url(#neonLine)" stroke-width="3" opacity="0.7" filter="url(#blur14)"/>

  <!-- glass window -->
  <rect x="96" y="48" width="1088" height="304" rx="14" fill="#110e1c" fill-opacity="0.78"/>
  <rect x="96" y="48" width="1088" height="304" rx="14" fill="none" stroke="#d04dff" stroke-opacity="0.35" stroke-width="1.5"/>
  <g clip-path="url(#win)">
    <rect x="96" y="48" width="1088" height="304" fill="url(#scan)"/>
    <!-- title bar -->
    <rect x="96" y="48" width="1088" height="38" fill="#0d0b16" fill-opacity="0.9"/>
    <rect x="96" y="85" width="1088" height="2" fill="url(#neonLine)"/>
  </g>
  <circle cx="122" cy="67" r="6" fill="#ff2d78"/>
  <circle cx="144" cy="67" r="6" fill="#ffb59f"/>
  <circle cx="166" cy="67" r="6" fill="#00ff41"/>
  <text x="640" y="72" text-anchor="middle" font-family="'JetBrainsMono Nerd Font','JetBrainsMono NF','JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" fill="#d04dff" fill-opacity="0.85" letter-spacing="2">s1b@neon: ~</text>

  <!-- prompt -->
  <g font-family="'JetBrainsMono Nerd Font','JetBrainsMono NF','JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace">
    <text x="136" y="140" font-size="20" fill="#00ff41">&gt;</text>
    <text x="162" y="140" font-size="20" fill="#00d4ff">s1b@neon</text>
    <text x="272" y="140" font-size="20" fill="#e8dcff" fill-opacity="0.75">:~$</text>
    <text x="322" y="140" font-size="20" fill="#ffb59f">steam --skin S1B-Neon</text>

    <!-- title glow + title -->
    <text x="136" y="250" font-size="104" font-weight="800" fill="#ff2d78" opacity="0.55" filter="url(#blur14)" letter-spacing="6">S1B NEON</text>
    <text x="136" y="250" font-size="104" font-weight="800" fill="url(#title)" letter-spacing="6">S1B NEON</text>

    <!-- subtitle -->
    <text x="140" y="298" font-size="22" fill="#e8dcff" fill-opacity="0.9">Cyberpunk glass-neon skin for Steam <tspan fill="#d04dff">·</tspan> Millennium</text>

    <!-- cursor -->
    <rect x="140" y="318" width="14" height="4" fill="#00ff41"/>
  </g>

  <!-- decorative keycaps -->
  <g font-family="'JetBrainsMono Nerd Font','JetBrainsMono NF','JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="15" font-weight="700" text-anchor="middle">
    <g>
      <rect x="944" y="136" width="96" height="44" rx="8" fill="#00ff41" fill-opacity="0.14" stroke="#00ff41" stroke-width="1.5"/>
      <rect x="944" y="174" width="96" height="6" rx="3" fill="#00ff41" fill-opacity="0.45"/>
      <text x="992" y="164" fill="#00ff41">PLAY</text>
    </g>
    <g>
      <rect x="1056" y="136" width="96" height="44" rx="8" fill="#ff2d78" fill-opacity="0.14" stroke="#ff2d78" stroke-width="1.5"/>
      <rect x="1056" y="174" width="96" height="6" rx="3" fill="#ff2d78" fill-opacity="0.45"/>
      <text x="1104" y="164" fill="#ff2d78">NEW</text>
    </g>
    <g>
      <rect x="944" y="200" width="96" height="44" rx="8" fill="#00d4ff" fill-opacity="0.14" stroke="#00d4ff" stroke-width="1.5"/>
      <rect x="944" y="238" width="96" height="6" rx="3" fill="#00d4ff" fill-opacity="0.45"/>
      <text x="992" y="228" fill="#00d4ff">FRIENDS</text>
    </g>
    <g>
      <rect x="1056" y="200" width="96" height="44" rx="8" fill="#d04dff" fill-opacity="0.14" stroke="#d04dff" stroke-width="1.5"/>
      <rect x="1056" y="238" width="96" height="6" rx="3" fill="#d04dff" fill-opacity="0.45"/>
      <text x="1104" y="228" fill="#d04dff">STORE</text>
    </g>
  </g>

  <!-- bottom neon line -->
  <rect x="0" y="394" width="1280" height="6" fill="url(#neonLine)"/>
  <rect x="0" y="392" width="1280" height="10" fill="url(#neonLine)" opacity="0.5" filter="url(#blur6)"/>
</svg>
